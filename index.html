<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Morocco Dreams</title>

  <!-- REAL ICONS -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .logo {
      font-size: 55px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .welcome {
      font-size: 19px;
      margin-bottom: 10px;
    }

    .description {
      line-height: 1.6;
      margin-bottom: 30px;
      opacity: 0.9;
    }

    .link {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 17px 20px;
      margin: 14px 0;
      background: white;
      color: #222;
      text-decoration: none;
      border-radius: 16px;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 7px 20px rgba(0,0,0,.2);
    }

    .link i {
      width: 45px;
      font-size: 29px;
      margin-right: 15px;
    }

    .website i {
      color: #2575fc;
    }

    .whatsapp i {
      color: #25D366;
    }

    .instagram i {
      color: #E1306C;
    }

    .facebook i {
      color: #1877F2;
    }

    .link:active {
      transform: scale(.97);
    }

    footer {
      margin-top: 30px;
      font-size: 13px;
      opacity: .8;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">🇲🇦</div>

  <h1>Morocco Dreams</h1>

  <div class="welcome">
    Welcome to Morocco Dreams
  </div>

  <p class="description">
    Discover the beauty of Morocco with us.<br>
    Follow us and contact us for more information.
  </p>

  <!-- WEBSITE -->
  <a class="link website"
     href="https://morocco-dreams.com"
     target="_blank">
    <i class="fa-solid fa-globe"></i>
    <span>Official Website</span>
  </a>

  <!-- WHATSAPP -->
  <a class="link whatsapp"
     href="https://wa.me/212691223601"
     target="_blank">
    <i class="fa-brands fa-whatsapp"></i>
    <span>WhatsApp</span>
  </a>

  <!-- INSTAGRAM -->
  <a class="link instagram"
     href="https://www.instagram.com/morocco___dreams"
     target="_blank">
    <i class="fa-brands fa-instagram"></i>
    <span>Instagram</span>
  </a>

  <!-- FACEBOOK -->
  <a class="link facebook"
     href="https://www.facebook.com/share/1D7WYkjmti/"
     target="_blank">
    <i class="fa-brands fa-facebook-f"></i>
    <span>Facebook</span>
  </a>

  <footer>
    © Morocco Dreams
  </footer>

</div>

</body>
</html>
